name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libgtk-3-dev libx11-dev libxtst-dev \
            libxkbcommon-dev libsqlite3-dev libasound2-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Build (debug, for the test harness)
        working-directory: app
        run: flutter build linux --debug

      # The harness needs a display for the X11 keyboard backend and an audio
      # device for the mixer. Xvfb supplies one, the ALSA null sink the other.
      - name: Smoke test
        working-directory: app
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          sudo apt-get install -y xvfb
          cat > /tmp/asound.conf <<'ASOUND'
          pcm.!default { type null }
          ctl.!default { type null }
          ASOUND
          sudo cp /tmp/asound.conf /etc/asound.conf
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            ./run.sh --smoketest ../spike/assets/sounds

      - name: Package
        run: ./scripts/package.sh all

      - uses: actions/upload-artifact@v4
        with:
          name: ruckus-linux-x86_64
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
          generate_release_notes: true
